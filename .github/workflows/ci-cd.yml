name: Cloud DevOps Capstone CI/CD

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Project Files
        run: |
          test -f index.html
          test -f Dockerfile
          test -f docker-compose.yml
          echo "Project files verified"

      - name: Build Docker Image
        run: |
          docker build -t codomax-capstone .

      - name: Run Docker Container
        run: |
          docker run -d -p 8080:80 --name capstone-test codomax-capstone
          sleep 5

      - name: Test Web Application
        run: |
          curl -f http://localhost:8080
          echo "Web application test successful"

      - name: Stop Test Container
        run: |
          docker stop capstone-test
          docker rm capstone-test

      - name: Deploy to EC2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/codomax-cloud-devops-capstone
            git pull origin main
            docker compose down
            docker compose up -d --build
            docker compose ps
